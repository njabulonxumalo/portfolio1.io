            --muted: #a1a1aa;
            --border: #303030;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.7;
        }

        a {
            color: inherit;
        }

        .container {
            width: 80%;
            max-width: 1200px;
            margin: auto;
        }

        .section {
            padding: 100px 0;
        }

        .section-title {
            font-size: 36px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 15px;
        }

        .section-subtitle {

        .highlight {

            display: flex;

        }

            line-height: 1.2;
            margin-bottom: 20px;
        }

            color: #c4c4c4;
            font-size: 17px;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 13px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);

        .btn-outline {
